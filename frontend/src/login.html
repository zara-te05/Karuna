<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtEdu - Inicio de sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600&display=swap">
    <style>
        :root {
            --primary-color: #6C63FF;
            --secondary-color: #FF6584;
            --accent-color: #36D1DC;
            --dark-color: #1A1D2B;
            --light-color: #FFFFFF;
            --gray-light: #F5F7FA;
            --gray-medium: #E8ECEF;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-dark: rgba(26, 29, 43, 0.85);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-dark: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gray-light) 0%, #e6e9f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark-color);
            overflow-x: hidden;
        }

        /* Fondo con imágenes artísticas */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15;
        }

        .bg-1 {
            top: 0;
            left: 0;
            background: url('https://images.unsplash.com/photo-1550686041-366ad85a1355?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        .bg-2 {
            top: 0;
            right: 0;
            background: url('https://images.unsplash.com/photo-1545235617-9465d2a55698?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }

        /* Elementos decorativos */
        .decorative-element {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: -1;
        }

        .decorative-element:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 10%;
            right: 5%;
            background: rgba(108, 99, 255, 0.05);
        }

        .decorative-element:nth-child(4) {
            width: 100px;
            height: 100px;
            bottom: 15%;
            left: 8%;
            background: rgba(255, 101, 132, 0.05);
        }

        /* Contenedor principal */
        .main-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Encabezado */
        .header {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 2.5rem;
            margin-right: 15px;
            color: var(--primary-color);
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.1));
        }

        .logo-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--dark-color);
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 10px;
            color: rgba(26, 29, 43, 0.7);
            font-family: 'Quicksand', sans-serif;
        }

        /* Sistema de tarjetas - CORREGIDO */
        .cards-container {
            display: flex;
            width: 100%;
            gap: 30px;
            justify-content: center;
            align-items: stretch;
            perspective: 1000px;
        }

        .card {
            flex: 1;
            min-width: 300px;
            max-width: 450px;
            height: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: var(--shadow);
            padding: 40px;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Tarjeta oscura para registro */
        .card.dark {
            background: var(--glass-dark);
            color: var(--light-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-dark);
        }

        /* Efectos de tarjeta */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .card.dark::before {
            background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
        }

        /* Decoración de tarjeta */
        .card-decoration {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            opacity: 0.05;
            z-index: 0;
        }

        .light-card .card-decoration {
            background: linear-gradient(45deg, var(--primary-color), transparent);
            top: -80px;
            right: -80px;
        }

        .dark-card .card-decoration {
            background: linear-gradient(45deg, var(--secondary-color), transparent);
            bottom: -80px;
            left: -80px;
        }

        /* Contenido de tarjeta */
        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card-header {
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-color);
        }

        .dark .card-title {
            color: var(--light-color);
        }

        .card-subtitle {
            font-size: 0.95rem;
            color: rgba(26, 29, 43, 0.7);
            font-weight: 400;
        }

        .dark .card-subtitle {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Formularios */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(26, 29, 43, 0.8);
            font-weight: 500;
        }

        .dark .form-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .input-with-icon {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--gray-medium);
            border-radius: 10px;
            color: var(--dark-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .dark .form-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--light-color);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        .dark .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(54, 209, 220, 0.3);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(26, 29, 43, 0.5);
        }

        .dark .input-icon {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .checkbox {
            margin-right: 8px;
        }

        .forgot-link {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        .dark .forgot-link {
            color: var(--accent-color);
        }

        .forgot-link:hover {
            color: var(--dark-color);
            text-decoration: underline;
        }

        .dark .forgot-link:hover {
            color: var(--light-color);
        }

        /* Botones */
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: auto;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(45deg, var(--secondary-color), #FF8A9B);
            color: white;
            width: 100%;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 101, 132, 0.2);
        }

        .btn-icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        /* Toggle entre formularios */
        .card-toggle {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
        }

        .toggle-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dark .toggle-link {
            color: var(--accent-color);
        }

        .toggle-link:hover {
            color: var(--dark-color);
            text-decoration: underline;
        }

        .dark .toggle-link:hover {
            color: var(--light-color);
        }

        /* Animaciones */
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: floatIn 0.6s ease-out forwards;
        }

        .dark {
            animation-delay: 0.2s;
            animation-fill-mode: backwards;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .cards-container {
                flex-direction: column;
                align-items: center;
            }
            
            .card {
                width: 100%;
                max-width: 500px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 25px;
                height: auto;
                min-height: 520px;
            }
            
            .logo-text {
                font-size: 2.2rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
        }

        /* Indicador visual de tarjeta activa */
        .card.active {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }
    </style>
</head>

<body>
    <!-- Fondo con imágenes -->
    <div class="background-container">
        <div class="background-image bg-1"></div>
        <div class="background-image bg-2"></div>
        <div class="decorative-element floating"></div>
        <div class="decorative-element floating" style="animation-delay: 2s;"></div>
    </div>

    <div class="main-container">
        <!-- Encabezado -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-palette"></i>
                </div>
                <h1 class="logo-text">ArtEdu</h1>
            </div>
            <p class="tagline">Donde el aprendizaje se encuentra con la creatividad</p>
        </div>

        <!-- Sistema de tarjetas CORREGIDO -->
        <div class="cards-container">
            <!-- Tarjeta de Login (clara) -->
            <div class="card light-card active" id="loginCard">
                <div class="card-decoration"></div>
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="card-title">Iniciar Sesión</h2>
                        <p class="card-subtitle">Accede a tu espacio creativo de aprendizaje</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label">Correo electrónico</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" class="form-input" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-input" placeholder="Tu contraseña" required>
                            </div>
                        </div>
                        
                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="remember" class="checkbox">
                                <label for="remember">Recordar sesión</label>
                            </div>
                            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt btn-icon"></i> Iniciar Sesión
                        </button>
                    </form>
                    
                    <div class="card-toggle">
                        <p>¿No tienes una cuenta? <span class="toggle-link" id="showSignup">Crear cuenta</span></p>
                    </div>
                </div>
            </div>
            
            <!-- Tarjeta de Registro (oscura) -->
            <div class="card dark-card dark" id="signupCard">
                <div class="card-decoration"></div>
                <div class="card-content">
                    <div class="card-header">
                        <h2 class="card-title">Crear Cuenta</h2>
                        <p class="card-subtitle">Únete a nuestra comunidad creativa</p>
                    </div>
                    
                    <form id="signupForm">
                        <div class="form-group">
                            <label class="form-label">Nombre completo</label>
                            <div class="input-with-icon">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" class="form-input" placeholder="Tu nombre completo" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Correo electrónico</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" class="form-input" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-input" placeholder="Crea una contraseña segura" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Confirmar contraseña</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" class="form-input" placeholder="Repite tu contraseña" required>
                            </div>
                        </div>
                        
                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="terms" class="checkbox" required>
                                <label for="terms">Acepto los términos y condiciones</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-secondary">
                            <i class="fas fa-user-plus btn-icon"></i> Crear Cuenta
                        </button>
                    </form>
                    
                    <div class="card-toggle">
                        <p>¿Ya tienes una cuenta? <span class="toggle-link" id="showLogin">Iniciar Sesión</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Solo JS visual, sin lógica de formularios -->
    <script>
        // JS solo para efectos visuales
        
        // 1. Alternar indicador de tarjeta activa
        const loginCard = document.getElementById('loginCard');
        const signupCard = document.getElementById('signupCard');
        const showSignupBtn = document.getElementById('showSignup');
        const showLoginBtn = document.getElementById('showLogin');
        
        // Función para alternar la clase "active" entre tarjetas
        function toggleActiveCard(activeCard, inactiveCard) {
            // Remover clase active de ambas
            loginCard.classList.remove('active');
            signupCard.classList.remove('active');
            
            // Agregar clase active a la tarjeta seleccionada
            activeCard.classList.add('active');
            
            // Efecto visual sutil
            activeCard.style.transform = 'translateY(-5px)';
            inactiveCard.style.transform = 'translateY(0)';
            
            // Resetear después de la transición
            setTimeout(() => {
                activeCard.style.transform = '';
                inactiveCard.style.transform = '';
            }, 500);
        }
        
        // Event listeners para los enlaces de toggle
        showSignupBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleActiveCard(signupCard, loginCard);
        });
        
        showLoginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleActiveCard(loginCard, signupCard);
        });
        
        // 2. Efectos de hover en tarjetas
        const cards = document.querySelectorAll('.card');
        
        cards.forEach(card => {
            // Efecto al pasar el mouse
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-8px) scale(1.02)';
                card.style.boxShadow = '0 20px 40px rgba(0, 0, 0, 0.15)';
                card.style.transition = 'all 0.3s ease';
            });
            
            // Efecto al quitar el mouse
            card.addEventListener('mouseleave', () => {
                // Solo mantener la elevación si es la tarjeta activa
                if (!card.classList.contains('active')) {
                    card.style.transform = 'translateY(0) scale(1)';
                    card.style.boxShadow = 'var(--shadow)';
                } else {
                    card.style.transform = 'translateY(-5px)';
                    card.style.boxShadow = '0 15px 35px rgba(0, 0, 0, 0.15)';
                }
            });
        });
        
        // 3. Efectos de enfoque en inputs
        const inputs = document.querySelectorAll('.form-input');
        
        inputs.forEach(input => {
            // Al enfocar
            input.addEventListener('focus', function() {
                const parentCard = this.closest('.card');
                if (parentCard) {
                    parentCard.style.transform = 'translateY(-5px)';
                    parentCard.style.boxShadow = '0 20px 40px rgba(0, 0, 0, 0.2)';
                }
            });
            
            // Al perder el foco
            input.addEventListener('blur', function() {
                const parentCard = this.closest('.card');
                if (parentCard) {
                    // Solo mantener la elevación si es la tarjeta activa
                    if (!parentCard.classList.contains('active')) {
                        parentCard.style.transform = 'translateY(0)';
                        parentCard.style.boxShadow = 'var(--shadow)';
                    } else {
                        parentCard.style.transform = 'translateY(-5px)';
                        parentCard.style.boxShadow = '0 15px 35px rgba(0, 0, 0, 0.15)';
                    }
                }
            });
        });
        
        // 4. Animación de elementos decorativos
        document.addEventListener('DOMContentLoaded', function() {
            const decorativeElements = document.querySelectorAll('.decorative-element');
            
            decorativeElements.forEach((element, index) => {
                // Retraso escalonado para animaciones
                element.style.animationDelay = `${index * 1.5}s`;
                
                // Cambiar tamaño y posición aleatoria en pantallas grandes
                if (window.innerWidth > 768) {
                    const randomSize = 80 + Math.random() * 120;
                    element.style.width = `${randomSize}px`;
                    element.style.height = `${randomSize}px`;
                    
                    // Posición aleatoria pero dentro de la pantalla
                    const top = 5 + Math.random() * 85;
                    const left = 5 + Math.random() * 85;
                    element.style.top = `${top}%`;
                    element.style.left = `${left}%`;
                }
            });
            
            // 5. Efecto parallax en el fondo
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                
                const bgImages = document.querySelectorAll('.background-image');
                bgImages.forEach((img, index) => {
                    // Movimiento opuesto para crear efecto de profundidad
                    const direction = index % 2 === 0 ? 1 : -1;
                    img.style.transform = `translate(${xAxis * direction * 0.3}px, ${yAxis * direction * 0.3}px)`;
                });
                
                // Movimiento sutil en las tarjetas
                cards.forEach(card => {
                    card.style.transform = `translateY(-5px) translate(${xAxis * 0.1}px, ${yAxis * 0.1}px)`;
                });
            });
            
            // 6. Efecto de aparición escalonada
            const cardElements = document.querySelectorAll('.card');
            cardElements.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 300 * index);
            });
        });
        
        // 7. Efecto de "respiración" para la tarjeta activa
        function breathingEffect() {
            const activeCard = document.querySelector('.card.active');
            if (activeCard) {
                // Oscilación suave del box-shadow
                const intensity = 0.05 + Math.sin(Date.now() / 2000) * 0.05;
                const shadowOpacity = 0.15 + intensity;
                
                if (activeCard.classList.contains('dark')) {
                    activeCard.style.boxShadow = `0 15px 35px rgba(0, 0, 0, ${shadowOpacity + 0.05})`;
                } else {
                    activeCard.style.boxShadow = `0 15px 35px rgba(0, 0, 0, ${shadowOpacity})`;
                }
            }
            requestAnimationFrame(breathingEffect);
        }
        
        // Iniciar efecto de respiración
        breathingEffect();
    </script>
</body>
</html>
