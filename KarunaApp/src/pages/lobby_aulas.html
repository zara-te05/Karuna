<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <style>
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #fdfbf3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #e6e3db;
            border-top-color: #1b3a1e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
    </style>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37",
                        "indigo-deep": "#1E1B4B",
                        "slate-soft": "#F1F5F9",
                        "background-light": "#F8FAFC",
                        "background-dark": "#1a1a2e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            transition: background-color 0.8s ease, color 0.8s ease, border-color 0.8s ease;
        }

        .fluid-waves {
            background-color: #fdfaf1;
            background-image:
                radial-gradient(at 0% 0%, hsla(46, 15%, 90%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(230, 20%, 92%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(46, 15%, 90%, 1) 0, transparent 50%);
            position: relative;
            overflow: hidden;
            transition: background-color 0.8s ease;
        }

        .dark .fluid-waves {
            background-color: #1a1a2e;
            background-image:
                radial-gradient(at 0% 0%, hsla(230, 20%, 15%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(46, 15%, 10%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(230, 20%, 15%, 1) 0, transparent 50%);
        }

        .fluid-waves::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 1000 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
        }

        .dark .bg-white {
            background-color: #262640;
            color: #e8e8f0;
            border-color: rgba(212, 175, 55, 0.1);
        }

        .dark .text-slate-900 { color: #e8e8f0; }
        .dark .text-slate-600 { color: rgba(232, 232, 240, 0.7); }
        .dark .text-slate-500 { color: rgba(232, 232, 240, 0.6); }
        .dark .text-slate-400 { color: rgba(232, 232, 240, 0.5); }
        .dark .bg-slate-50 { background-color: rgba(42, 42, 62, 0.6); }
        .dark .ring-slate-200 { --tw-ring-color: rgba(212, 175, 55, 0.2); }
        .dark .border-slate-100 { border-color: rgba(212, 175, 55, 0.1); }
        .dark .hover\:bg-primary\/10:hover { background-color: rgba(212, 175, 55, 0.15); }

        * {
            transition-property: background-color, border-color, color, fill, stroke, box-shadow;
            transition-duration: 0.8s;
            transition-timing-function: ease;
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">

    <div id="page-overlay" style="
        position:fixed; inset:0; z-index:99999;
        background:#fdfaf1;
        display:flex; align-items:center; justify-content:center;
        font-family:serif;">
        <div style="text-align:center">
            <div style="
                width:40px; height:40px; margin:0 auto 12px;
                border:3px solid #e6e3db;
                border-top-color:#1b3a1e;
                border-radius:50%;
                animation:spin 0.8s linear infinite;
            "></div>
            <p style="color:#1b3a1e; font-weight:bold; font-size:1.1rem;">Karuna</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>


    <div class="flex min-h-screen">

        <!-- Sidebar Master -->
        <aside class="w-64 bg-indigo-deep text-white/90 flex flex-col fixed h-screen z-20 transition-all">
            <div class="absolute bottom-0 right-0 opacity-10 pointer-events-none">
                <span class="material-symbols-outlined text-[120px] text-primary">filter_vintage</span>
            </div>
            <div class="p-6 flex items-center gap-3">
                <div class="size-10 bg-primary rounded-lg flex items-center justify-center text-forest">
                    <span class="material-symbols-outlined font-bold text-white">temple_buddhist</span>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white font-serif-elegant">Karuna</h1>
            </div>
            <nav class="flex-1 mt-2 px-4 space-y-1">
                <a class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/10 transition-colors text-white/80"
                    href="aulas.html">
                    <span class="material-symbols-outlined">analytics</span>
                    <span class="font-medium">Vista de Estadísticas</span>
                </a>
                <a class="flex items-center gap-4 px-4 py-3 rounded-lg bg-white/10 border-l-4 border-primary text-white"
                    href="lobby_aulas.html">
                    <span class="material-symbols-outlined">groups</span>
                    <span class="font-medium">Aulas</span>
                </a>
                <a class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/10 transition-colors text-white/80"
                    href="#">
                    <span class="material-symbols-outlined">assessment</span>
                    <span class="font-medium">Reportes</span>
                </a>
                <a class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-white/10 transition-colors text-white/80"
                    href="profile.html">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="font-medium">Perfil</span>
                </a>
            </nav>
            <div class="p-4 border-t border-white/10">
                <a href="crear_aulas.html"
                    class="w-full bg-primary hover:bg-primary/90 text-indigo-deep font-bold py-3 rounded-xl transition-all shadow-md shadow-primary/10 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">add</span>
                    <span>Nuevo Salón</span>
                </a>
            </div>
        </aside>

        <!-- Page wrapper -->
        <div class="flex-1 ml-64 min-h-screen flex flex-col">
            <!-- Header -->
            <header
                class="sticky top-0 z-10 bg-slate-soft/80 backdrop-blur-md border-b border-indigo-deep/10 px-8 py-4 flex items-center justify-between bg-white/40">
                <div class="flex items-center gap-4 flex-1 max-w-xl">
                    <div class="relative w-full">
                        <span
                            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-forest/40">search</span>
                        <input
                            class="w-full pl-10 pr-4 py-2 bg-indigo-deep/5 border-none rounded-xl focus:ring-2 focus:ring-primary text-indigo-deep placeholder:text-indigo-deep/40"
                            placeholder="Buscar aulas o materiales..." type="text" />
                    </div>
                </div>

                <button
                    class="p-2 rounded-full hover:bg-indigo-deep/10 dark:hover:bg-white/10 transition-colors text-indigo-deep dark:text-white flex items-center justify-center"
                    id="theme-toggle" title="Alternar Modo Oscuro">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block">light_mode</span>
                </button>

                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3 pl-4 border-l border-forest/10">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-bold text-forest leading-none" id="nombre_docente">Prof. Julián
                                Thorne</p>
                        </div>
                        <div class="size-10 rounded-full bg-primary/20 border-2 border-primary/60 overflow-hidden">
                            <img id="imagen-perfil" alt="Perfil del profesor" class="w-full h-full object-cover"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmUtN4wGsfp3yeKp9YXvQd3VgllVW0If4f2HiPlbtIcwS0gIC_njhkyaRlmXVUBO_ZkUIONPQ5mDwnwl5ZK-QcxUgeCU4FlXUjvzeg5ULesd_NJpHgXrIM60ne8pmrwi6yWscx_rakXYpU0gndLqI-lx1_Z4gpJ04vOO0LhERG-DuxoZHKxLo_NHjsFWzSmFSgNaDxs6wmmIfsZz7BqYDOYDZiNRLzVjo27JvT-yspxiNkPPIF7qYsg9ADy0Hnh9bael0v1Qpdc5Q" />
                        </div>
                    </div>
                </div>
            </header>
            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto fluid-waves">
                <div class="px-10 pb-20 pt-10">

                    <!-- Filters -->
                    <div class="flex gap-4 mb-8 overflow-x-auto pb-2">
                        <button class="px-5 py-2 rounded-full bg-indigo-deep text-white text-sm font-medium">All
                            Sessions</button>
                        <button
                            class="px-5 py-2 rounded-full bg-white ring-1 ring-slate-200 text-slate-600 text-sm font-medium hover:bg-primary/10">Active</button>
                        <button
                            class="px-5 py-2 rounded-full bg-white ring-1 ring-slate-200 text-slate-600 text-sm font-medium hover:bg-primary/10">Archived</button>
                        <button
                            class="px-5 py-2 rounded-full bg-white ring-1 ring-slate-200 text-slate-600 text-sm font-medium hover:bg-primary/10">Drafts</button>
                    </div>

                    <!-- Cards Grid — las cards reales las inyecta lobby_aulas.ts -->
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">

                        <!-- Placeholder "Nuevo Salón" — siempre al final del grid -->
                        <a href="crear_aulas.html"
                           data-placeholder
                           class="group border-2 border-dashed border-slate-200 dark:border-primary/20
                                  rounded-xl flex flex-col items-center justify-center p-12 text-center
                                  hover:border-primary/50 hover:bg-white/50 dark:hover:bg-primary/5
                                  transition-all cursor-pointer no-underline">
                            <div class="size-16 rounded-full bg-slate-50 dark:bg-white/5 flex items-center
                                        justify-center text-slate-400 group-hover:bg-primary/20
                                        group-hover:text-primary mb-4 transition-all">
                                <span class="material-symbols-outlined text-3xl">add_circle</span>
                            </div>
                            <h4 class="text-lg font-serif font-bold text-slate-700 dark:text-slate-200">
                                Nuevo Salón
                            </h4>
                            <p class="text-sm text-slate-400 dark:text-slate-500 max-w-[200px] mt-2 italic">
                                Define un nuevo espacio de aprendizaje para tus estudiantes.
                            </p>
                        </a>

                    </div>
                </div>
            </main>

        </div>

        <!-- FAB Mobile -->
        <button
            class="fixed bottom-8 right-8 lg:hidden size-14 bg-primary text-indigo-deep rounded-full shadow-2xl flex items-center justify-center z-50">
            <span class="material-symbols-outlined text-2xl font-bold">add</span>
        </button>
        <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
            htmlElement.classList.remove('light');
        } else {
            htmlElement.classList.remove('dark');
            htmlElement.classList.add('light');
        }

        window.addEventListener('load', () => {
            const overlay = document.getElementById('page-overlay');
            if (overlay) {
                overlay.style.transition = 'opacity 0.4s ease';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 400);
            }
        });
    </script>
    <script type="module" src="/scripts/lobby_aulas.ts"></script>
</body>

</html>
